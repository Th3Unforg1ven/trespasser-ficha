<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171717">
  <meta name="description" content="Ficha editável de Trespasser v2.1.3. Salve seus personagens na conta para continuar no celular e no computador. Exporte PDF preenchível e JSON.">
  <title>Trespasser · Ficha de personagem</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./sheet.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Ir para a ficha</a>
  <div class="workspace">
    <header class="topbar">
      <div class="record-toolbar">
        <div class="archive-tools"><span class="eyebrow">ARQUIVO DE PERSONAGENS · V2.1.3</span><label class="mobile-character-choice"><span class="sr-only">Trocar personagem</span><select id="mobile-character-select"></select></label><button id="add-character" class="button add-character" title="Criar personagem">+ Novo</button></div>
        <div class="top-actions"><button id="dice-open" class="button dice-trigger"><span aria-hidden="true">◇</span> Dados</button><button class="button subtle" id="import-button">Importar</button><button class="button" id="export-button" title="Exportar PDF preenchível e JSON">Exportar <span aria-hidden="true">↓</span></button><button class="icon-button print-button" id="print-button" title="Imprimir ficha" aria-label="Imprimir ficha">⎙</button><button class="button account-button" id="account-button" title="Entrar para salvar suas fichas online">Entrar</button></div>
      </div>
      <div class="record-status"><div class="breadcrumb">REGISTRO <span>/</span> <span id="breadcrumb-name">Novo personagem</span></div><span id="save-status" role="status"><span class="status-dot"></span>Salvo neste navegador</span></div>
      <div id="character-list" hidden></div><button id="new-character" hidden>Criar personagem</button><button id="mobile-new" hidden>Criar personagem</button><button id="mobile-dice" hidden>Rolar dados</button>
    </header>
    <main id="main" tabindex="-1">
      <div id="resources"></div>
      <div id="identity"></div>
      <nav id="navigation" class="sheet-navigation" aria-label="Seções da ficha"></nav>
      <div class="section-heading"><div class="tab-title"><span class="chapter-number" id="chapter-number">01</span><div><h2 id="section-title">Personagem</h2><p id="section-description">A pessoa por trás da aventura.</p></div></div><button id="sheet-menu-button" class="button subtle">Gerenciar ficha <span aria-hidden="true">⌄</span></button></div>
      <div id="sheet-content"></div>
      <footer class="page-footer"><span>TRESPASSER V2.1.3 · REGISTRO NÃO OFICIAL</span><button id="about-button">Cálculos & salvamento <span aria-hidden="true">↗</span></button></footer>
    </main>
  </div>
  <dialog id="utility-dialog" aria-labelledby="dialog-title"><div class="dialog-header"><h2 id="dialog-title"></h2><button class="icon-button" id="dialog-close" aria-label="Fechar">×</button></div><div id="dialog-content"></div></dialog>
  <div id="toast" role="status" class="toast" hidden></div>
  <input type="file" id="import-file" accept=".json,application/json" hidden>
</body>
</html>
